# Al subir una etiqueta de versión (v0.1.0, v0.2.0, ...):
#   1) crea la Release en GitHub con el reporte adjunto (descargable)
#   2) publica ESA versión en la página (GitHub Pages)
# La página pública solo cambia cuando se crea una release; los commits a main no la tocan.
name: Release y publicación

on:
  push:
    tags: ['v*.*.*', 'v*.*']

permissions:
  contents: write   # crear la release
  pages: write      # publicar en GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar archivo de la versión
        run: |
          mkdir -p dist
          cp "Reporte Folios iCash.html" "dist/Reporte-Folios-iCash-${GITHUB_REF_NAME}.html"
          sed -i "s|__APP_VERSION__|${GITHUB_REF_NAME}|g" dist/*.html

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.html \
            --title "Folios iCash ${GITHUB_REF_NAME}" \
            --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp "Reporte Folios iCash.html" _site/index.html
          sed -i "s|__APP_VERSION__|${GITHUB_REF_NAME}|g" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
